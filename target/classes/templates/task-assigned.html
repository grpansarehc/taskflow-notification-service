<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }
        .content {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }
        .task-details {
            background-color: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
        }
        .task-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #764ba2;
        }
        .footer {
            background-color: #f4f7f6;
            color: #777777;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }
        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #667eea;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .priority-HIGH { color: #e53e3e; font-weight: bold; }
        .priority-MEDIUM { color: #d69e2e; font-weight: bold; }
        .priority-LOW { color: #38a169; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Task Assigned!</h1>
            <p>You have a new task waiting for you.</p>
        </div>
        <div class="content">
            <p>Hi <span th:text="${task.assignee.name}">User</span>,</p>
            <p><span th:text="${task.assignedBy}">Someone</span> has assigned a new task to you in project <strong><span th:text="${task.projectName}">Project</span></strong>.</p>
            
            <div class="task-details">
                <div class="task-title" th:text="${task.title}">Task Title</div>
                <p th:text="${task.description}">Task Description goes here.</p>
                <p><strong>Priority:</strong> <span th:class="'priority-' + ${task.priority}" th:text="${task.priority}">MEDIUM</span></p>
                <p><strong>Due Date:</strong> <span th:text="${#temporals.format(task.dueDate, 'dd MMMM yyyy HH:mm')}">Date</span></p>
            </div>
            
            <a href="#" class="button">View Task in Kanban</a>
            
            <p>Happy working!<br>The TaskFlow Team</p>
        </div>
        <div class="footer">
            &copy; 2026 TaskFlow Inc. | All rights reserved.
        </div>
    </div>
</body>
</html>
